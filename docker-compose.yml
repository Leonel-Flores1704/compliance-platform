name: compliance-platform

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      APP_ENV: ${AI_APP_ENV:-local}
      # Must be providers listed in ai-service/config/authorized_providers.yaml (ADR-011, CMP-28).
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local-embeddings}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # CMP-29: the AI service writes document_chunks (schema owned by Laravel migrations).
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
      EMBEDDING_DIM: ${AI_EMBEDDING_DIMENSIONS:-1024}
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys, urllib.request; req = urllib.request.Request('http://localhost:8001/health', headers={'X-Internal-Token': os.getenv('AI_SERVICE_TOKEN', '')}); sys.exit(0 if urllib.request.urlopen(req).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - documents_storage:/var/www/html/storage/app/documents
    environment: &laravel-env
      APP_ENV: local
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1024}
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost,127.0.0.1
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: "lax"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  queue-worker:
    build: ./backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=documents", "--tries=3", "--backoff=30,120,300", "--timeout=300"]
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - documents_storage:/var/www/html/storage/app/documents
    environment: *laravel-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pg_data:
  documents_storage:
  backend_vendor:
  certbot_www: